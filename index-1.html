<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BabyTalk</title><style>body{font-family:Arial;background:#fff7f8;padding:20px}.card{max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:16px;text-align:center}button{padding:10px 16px;margin:6px}#en{font-size:28px;color:#e94a8b}#ko{font-size:20px}</style></head><body><div class="card"><h1>🌷 BabyTalk</h1><h3>🌞 기상</h3><div id="num"></div><div id="ko"></div><div id="en"></div><button onclick="speak()">🔊</button><br><button onclick="prev()">◀</button><button onclick="next()">▶</button></div><script src="db.js"></script><script>let i=0,d=babyTalkDB.wake;function show(){num.textContent=(i+1)+" / "+d.length;ko.textContent=d[i].ko;en.textContent=d[i].en}function next(){i=(i+1)%d.length;show()}function prev(){i=(i-1+d.length)%d.length;show()}function speak(){let u=new SpeechSynthesisUtterance(d[i].en);u.lang="en-US";speechSynthesis.speak(u)}show();</script></body></html>
